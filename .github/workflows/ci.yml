name: CI

# Checks pull requests and work branches; main is checked by the deploy workflow.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # A required check for main (see the ruleset): keep the name.
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The runner's preinstalled JDK and git run the golden tests (java.test.ts, git.test.ts).
      - name: Test
        run: npm test

      - name: Type-check and build
        run: npm run build
