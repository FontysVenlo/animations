version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Commit messages follow Conventional Commits.
    commit-message:
      prefix: "build"
      include: "scope"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # svelte-check supports TypeScript 5 and 6 only. Remove this once it supports 7.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # The types for the Node version in .nvmrc (an LTS): raise both together at the next LTS.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      github-actions:
        patterns:
          - "*"
